# System Configuration
# Warehouse Sorting MPC + Vision

# Robot Configuration
robot:
  type: "UR7e"
  ip_address: "192.168.1.100"  # Update with actual robot IP
  n_joints: 6
  home_position: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]  # Joint angles in radians
  
# Gripper Configuration
gripper:
  type: "Robotiq 2f-85"
  default_force: 100  # 0-255
  open_position: 0
  closed_position: 255

# Camera Configuration
camera:
  type: "RealSense D435"
  width: 640
  height: 480
  fps: 30
  depth_scale: 0.001  # Depth units to meters

# MPC Parameters
mpc:
  horizon: 5  # Prediction horizon (steps) - 5 * 0.05s = 0.25s lookahead
  dt: 0.05  # Time step in seconds (must match control loop: 250 * 0.0002s = 0.05s)
  max_iterations: 5  # Max Ipopt iterations per solve (real-time tuning)
  convergence_threshold: 5e-3  # Relaxed tolerance for real-time performance
  execution_mode: "receding_horizon"  # Solve MPC at EVERY control step
  
  # Cost weights
  weights:
    position_error: 500.0  # Q - Position tracking weight
    terminal_error: 1000.0  # Q_terminal - Final state weight
    control_smoothness: 0.1  # R - Control effort weight
    obstacle_penalty: 10000.0  # Penalty for being inside obstacle safety margin
  
  # Constraints
  joint_limits:
    lower: [-6.28, -6.28, -6.28, -6.28, -6.28, -6.28]
    upper: [6.28, 6.28, 6.28, 6.28, 6.28, 6.28]
  max_velocity: 3.0  # rad/s (tuned for smooth motion)
  
  # Collision avoidance (multi-link protection)
  safety_margin: 0.05  # meters - minimum clearance from obstacles (5cm)
  object_clearance: 0.03  # meters - extra margin when holding objects (+3cm = 8cm total)
  collision_check_points: 7  # Number of arm link bodies checked (base → wrist3)
  collision_strategy: "post_solve_rejection"  # Reject trajectories with actual penetration only
  # Note: Trajectories are only rejected if they actually penetrate obstacle geometry,
  # not just for coming within safety_margin. This reduces false rejections and allows
  # smoother, more natural motion while still guaranteeing collision-free execution.
  
  # Trajectory execution
  # True receding horizon: MPC solved every control step
  # Applies only first command, then replans from new state

# Object Detection
detection:
  model_type: "yolo"
  model_path: "data/models/yolo_weights.pt"
  confidence_threshold: 0.5
  nms_threshold: 0.4
  
  # Object classes
  classes:
    0: "cube_red"
    1: "cube_blue"
    2: "cylinder_green"
    3: "box_yellow"

# Grasp Prediction
grasp_predictor:
  model_type: "random_forest"
  model_path: "data/models/grasp_predictor.pkl"
  success_threshold: 0.5  # Minimum predicted probability to attempt grasp
  n_pose_samples: 10  # Number of poses to sample for optimization

# Sorting Zones
sorting_zones:
  cube_red: [0.3, -0.4, 0.1]
  cube_blue: [0.3, 0.4, 0.1]
  cylinder_green: [-0.3, -0.4, 0.1]
  box_yellow: [-0.3, 0.4, 0.1]
  default: [0.0, -0.5, 0.1]

# Workspace Bounds
workspace:
  x_range: [-0.5, 0.5]
  y_range: [-0.6, 0.6]
  z_range: [0.0, 0.8]

# Data Collection
data_collection:
  enabled: false
  save_directory: "data/raw"
  save_frequency: 10  # Save every N grasp attempts

# Testing and Evaluation
evaluation:
  baseline_controller: "PID"
  metrics:
    - "grasp_success_rate"
    - "average_cycle_time"
    - "mpc_solve_time"
    - "trajectory_smoothness"

