# MPC Controller Parameters
mpc_controller:
  ros__parameters:
    n_joints: 6
    horizon: 10           # Prediction horizon (steps)
    dt: 0.05             # Time step (seconds)
    enable_fk: true      # Use analytic FK for obstacle avoidance
    publish_rate: 20.0   # Control loop rate (Hz)
    
    # Cost weights
    Q_scalar: 500.0          # Position tracking weight
    Q_terminal_scalar: 1000.0 # Terminal cost weight
    R_scalar: 0.1            # Smoothness weight
    
    # Constraints
    max_velocity: 3.0    # rad/s
    
    # Obstacle avoidance
    safety_margin: 0.05  # meters (empty-handed)
    object_safety_margin: 0.08  # meters (holding object)
